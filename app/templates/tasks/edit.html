{% extends "base.html" %}

{% block title %}Edit Task · TaskFlow{% endblock %}

{% block content %}
<section class="hero">
  <h1>Edit Task</h1>
  <p class="subtitle">Update the details and save.</p>
</section>

<form class="card edit-form" action="{{ url_for('tasks.edit', task_id=task.id) }}" method="POST">
  <label for="title">Title</label>
  <input type="text" id="title" name="title" value="{{ task.title }}" required maxlength="200">

  <label for="description">Description</label>
  <textarea id="description" name="description" rows="4">{{ task.description or "" }}</textarea>

  <div class="form-actions">
    <a href="{{ url_for('tasks.index') }}" class="btn btn-ghost">Cancel</a>
    <button type="submit" class="btn btn-primary">Save Changes</button>
  </div>
</form>
{% endblock %}
